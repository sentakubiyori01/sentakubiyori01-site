<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>メッセージ｜せんたくびより</title>
  <meta name="description" content="作品への感想やメッセージを送れるゲストブックです。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>

  <div class="site-shell">

    <aside class="sidebar scallop-panel">
      <a class="brand-block" href="index.html">
        <img src="assets/brand-logo.png" alt="せんたくびよりのロゴ">
        <span class="brand-name">せんたくびより</span>
      </a>

      <nav class="side-nav" aria-label="メインメニュー">

        <a class="nav-home" href="index.html">⌂ <span>ホーム</span></a>
        <a class="nav-news" href="index.html#news-title">▤ <span>近況</span></a>
        <a class="nav-works" href="index.html#works-title">▦ <span>作品一覧</span></a>
        <a class="nav-guestbook" href="index.html#guestbook-title">◯ <span>メッセージ</span></a>
        <a class="nav-commission" href="index.html#commission">♧ <span>ご依頼について</span></a>
        <a class="nav-contact" href="mailto:sentakubiyori01@gmail.com">✉ <span>問い合わせ</span></a>

      </nav>

      <div class="sidebar-social">
        <a href="#" aria-label="X">X</a>
        <a href="#" aria-label="Instagram">Instagram</a>
        <a href="#" aria-label="note">note</a>
        <a href="#" aria-label="BOOTH">BOOTH</a>
        <a href="mailto:sentakubiyori01@gmail.com" aria-label="メール">Mail</a>
      </div>
    </aside>

    <div class="content-column">
      <header class="subpage-hero scallop-panel">
        <h1>メッセージ</h1>
        <p>作品の感想やひとことをどうぞ。いただいたメッセージへの返信も掲載します。</p>
      </header>

      <main id="main" class="subpage-main">
        <div class="guestbook-layout">
          <section class="panel" aria-labelledby="form-title">
            <h2 id="form-title">書き込み</h2>

            <form class="message-form" id="messageForm" novalidate>
              <label>
                お名前
                <input type="text" name="name" maxlength="40" placeholder="匿名でもOK">
              </label>

              <label>
                メッセージ
                <textarea name="message" required maxlength="1000" placeholder="作品の感想など"></textarea>
              </label>

              <label>
                返信用メール
                <input type="email" name="email" placeholder="非公開・任意">
                <small>サイト上で返信するだけなら入力不要です。</small>
              </label>

              <button class="submit-button" type="submit">メールで送る</button>
              <p class="form-status" id="formStatus" aria-live="polite"></p>
            </form>

            <div class="notice-box">
              送信ボタンを押すとメールアプリが開きます。内容を確認して送信してください。受け取ったメッセージは確認後、このページへ掲載します。
            </div>
          </section>

          <section class="panel" aria-labelledby="replies-title">
            <h2 id="replies-title">いただいたメッセージと返信</h2>

            <div class="guestbook-list" id="guestbookArchive"><p>読み込み中です…</p></div>
          </section>
        </div>
      </main>

      <footer class="footer scallop-panel">
        <nav>
          <a href="index.html">ホーム</a>
          <a href="index.html#news-title">近況</a>
          <a href="index.html#works-title">作品一覧</a>
          <a href="index.html#guestbook-title">メッセージ</a>
          <a href="index.html#commission">ご依頼について</a>
          <a href="mailto:sentakubiyori01@gmail.com">問い合わせ</a>
        </nav>
      </footer>
    </div>
  </div>
  <script src="site.js" defer></script>
</body>
</html>
